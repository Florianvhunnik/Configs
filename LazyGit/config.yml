# yaml-language-server: $schema= https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

gui:
  nerdFontsVersion: "3"
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  fileTreeSortCaseSensitive: false
  commitHashLength: 0
  expandFocusedSidePanel: true
  timeFormat: "02-01-2006 15:04"
  shortTimeFormat: "02-01-2006 15:04"
  spinner:
    rate: 83
    frames: ['', '', '', '', '', '']
  language: "en"
  theme:
    activeBorderColor:
      - blue
      - bold
    inactiveBorderColor:
      - default
    selectedLineBgColor:
      - reverse
    branchColorPatterns:
      '(?i)^(docs|release)([/_-]|$)': cyan
      '(?i)^refactor([/_-]|$)': white
      '(?i)^(bugfix|fix)([/_-]|$)': red
      '(?i)^feat(ure)?([/_-]|$)': green
      '(?i)^project([/_-]|$)': blue
      '(?i)^develop$': magenta
      '(?i)^(master|main)$': yellow
  customIcons:
    extensions:
      ".http":
        icon: "\U000F109B"
        color: '#5050FF'
notARepository: prompt
git:
  autoFetch: true
os:
  editPreset: vscode
